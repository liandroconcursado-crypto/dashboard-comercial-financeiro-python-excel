linkUnderline = false
greenColor = "#34D399"
redColor = "#FB7185"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
grayColor = "#A8B3C5"
chartCategoricalColors = ["#22D3EE", "#34D399", "#FB923C", "#38BDF8", "#A78BFA", "#FB7185", "#FACC15", "#94A3B8"]
