dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#13263E"

[theme.sidebar]
backgroundColor = "#0B172A"
secondaryBackgroundColor = "#13263E"
codeBackgroundColor = "#13263E"
textColor = "#F8FAFC"
