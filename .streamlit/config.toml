[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B172A"
secondaryBackgroundColor = "#13263E"
codeBackgroundColor = "#13263E"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Arial"
headingFont = "Arial"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
